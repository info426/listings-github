name: 1 · Generate Listings

on:
  workflow_dispatch:
    inputs:
      brand:
        description: "Nombre exacto del vendor en Shopify (p.ej. Virbac)"
        required: true
        type: string
      model:
        description: "Modelo de GitHub Models a usar"
        required: false
        default: "gpt-4o"
        type: choice
        options:
          - gpt-4o
          - gpt-4o-mini
          - meta-llama-3.1-405b-instruct
          - mistral-large

# Prevent parallel runs for the same brand to avoid duplicate files
concurrency:
  group: generate-${{ inputs.brand }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate SEO listings — ${{ inputs.brand }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      models: read       # Required for GitHub Models access

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate listings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: ${{ inputs.model }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: python scripts/generate.py "${{ inputs.brand }}"

      - name: Commit generated listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add listings/pending/
          if git diff --staged --quiet; then
            echo "Sin cambios nuevos que confirmar."
          else
            git commit -m "feat(listings): generate SEO listings for ${{ inputs.brand }} [${{ inputs.model }}]"
            git push
          fi
