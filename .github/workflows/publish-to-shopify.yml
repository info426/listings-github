name: 2 · Publish to Shopify

on:
  workflow_dispatch:
    inputs:
      brand:
        description: "Marca a publicar (dejar vacío para publicar todas las pendientes)"
        required: false
        type: string

jobs:
  publish:
    name: Publish ${{ inputs.brand || 'all pending brands' }} to Shopify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish to Shopify
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: |
          BRAND="${{ inputs.brand }}"
          if [ -n "$BRAND" ]; then
            python scripts/publish.py "$BRAND"
          else
            python scripts/publish.py
          fi

      - name: Commit published listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add listings/
          if git diff --staged --quiet; then
            echo "Sin cambios que confirmar."
          else
            git commit -m "feat(listings): publish listings to Shopify — ${{ inputs.brand || 'all' }}"
            git push
          fi
